<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W211 Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0c1124; --raised:#111733; --line:#1d2447; --text:#f3eee6; --dim:#8b91b3;
    --lav:#a99bf0; --pink:#ff86d4; --red:#ff6b8b; --amber:#f5c46b; --green:#7ee2a8;
    --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; font-size:15px; line-height:1.55; }
  .wrap { max-width:1080px; margin:0 auto; padding:28px 16px 64px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  h1 { font-size:1.35rem; font-weight:600; margin:0; letter-spacing:-0.01em; }
  h1 span { color:var(--lav); }
  .sub { font-family:var(--mono); font-size:.78rem; color:var(--dim); }
  .grid { display:grid; grid-template-columns:1.1fr .9fr; gap:16px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--raised); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .card h2 { font-family:var(--mono); font-weight:400; font-size:.78rem; color:var(--dim); margin:0 0 14px; }
  .card h2::before { content:"~/"; color:var(--lav); }
  label { display:block; font-size:.8rem; color:var(--dim); margin:0 0 4px; }
  input, select, textarea {
    width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:9px 11px; font:inherit; outline:none;
  }
  input:focus, select:focus, textarea:focus { border-color:var(--lav); }
  button {
    background:var(--lav); color:#0c1124; border:0; border-radius:8px; padding:9px 16px;
    font:inherit; font-weight:600; cursor:pointer;
  }
  button:hover { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; align-items:end; }
  .row > * { flex:1; }
  .row > button { flex:none; }
  .stack > * + * { margin-top:10px; }
  .due { list-style:none; padding:0; margin:14px 0 0; }
  .due li { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .pill { font-family:var(--mono); font-size:.7rem; padding:3px 9px; border-radius:99px; min-width:78px; text-align:center; }
  .overdue { background:rgba(255,107,139,.15); color:var(--red); }
  .due_now { background:rgba(255,134,212,.15); color:var(--pink); }
  .soon { background:rgba(245,196,107,.15); color:var(--amber); }
  .ok { background:rgba(126,226,168,.12); color:var(--green); }
  .never { background:rgba(139,145,179,.12); color:var(--dim); }
  .due .name { flex:1; }
  .due .detail { font-family:var(--mono); font-size:.75rem; color:var(--dim); text-align:right; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  td { padding:8px 0; border-top:1px solid var(--line); vertical-align:top; }
  td.km, td.date { font-family:var(--mono); font-size:.78rem; color:var(--dim); white-space:nowrap; padding-right:12px; }
  .empty { color:var(--dim); font-size:.88rem; margin:6px 0 0; }
  .ai-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:1px; background:var(--dim); }
  .ai-dot.on { background:var(--green); }
  .ai-dot.warn { background:var(--amber); }
  .chat { min-height:120px; max-height:380px; overflow:auto; margin-bottom:12px; }
  .msg { padding:10px 12px; border-radius:10px; margin-bottom:8px; white-space:pre-wrap; font-size:.9rem; }
  .msg.me { background:var(--bg); border:1px solid var(--line); }
  .msg.ai { background:rgba(169,155,240,.08); border:1px solid rgba(169,155,240,.25); }
  .msg.err { background:rgba(255,107,139,.08); border:1px solid rgba(255,107,139,.3); color:var(--red); }
  .toast { font-family:var(--mono); font-size:.75rem; color:var(--green); min-height:1.2em; }
  .full { grid-column:1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>W211 <span>Garage</span></h1>
    <div class="sub">2004 · E220 CDI · OM646 · manual</div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>whats-due</h2>
      <div class="row">
        <div><label for="km">Current mileage (km)</label><input id="km" inputmode="numeric" placeholder="e.g. 249000"></div>
        <button id="check">Check</button>
      </div>
      <ul class="due" id="due"></ul>
      <p class="empty" id="dueEmpty">Enter your mileage to see what's due.</p>
    </section>

    <section class="card">
      <h2>log-a-service</h2>
      <div class="stack">
        <div><label for="service">Service</label><select id="service"></select></div>
        <div id="otherWrap" hidden><label for="other">What was done</label><input id="other" placeholder="e.g. new suspension"></div>
        <div class="row">
          <div><label for="skm">Mileage (km)</label><input id="skm" inputmode="numeric"></div>
          <div><label for="sdate">Date</label><input id="sdate" type="date"></div>
        </div>
        <div><label for="notes">Notes (optional)</label><input id="notes" placeholder="parts, garage, price..."></div>
        <div class="row"><div class="toast" id="toast"></div><button id="save">Save</button></div>
      </div>
    </section>

    <section class="card">
      <h2>ask-the-mechanic</h2>
      <p class="sub" id="aiStatus"><span class="ai-dot"></span>checking local AI...</p>
      <div class="chat" id="chat"></div>
      <div class="row">
        <div><textarea id="q" rows="2" placeholder="e.g. grinding noise when I brake, what should I check?"></textarea></div>
        <button id="ask">Ask</button>
      </div>
    </section>

    <section class="card">
      <h2>history</h2>
      <table><tbody id="history"></tbody></table>
      <p class="empty" id="histEmpty">Nothing logged yet.</p>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString("en-US");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const LABELS = { overdue: "OVERDUE", due_now: "DUE NOW", soon: "SOON", ok: "OK", never: "NO DATA" };

function detail(r) {
  if (r.state === "never") return `every ${fmt(r.interval)} km`;
  if (r.state === "overdue") return `by ${fmt(-r.km_left)} km`;
  if (r.state === "due_now") return "change it now";
  if (r.state === "soon") return `in ${fmt(r.km_left)} km`;
  return `next at ${fmt(r.next_due)} km`;
}

async function refresh() {
  const km = $("km").value.trim();
  const res = await fetch(`/api/state?km=${encodeURIComponent(km)}`);
  const s = await res.json();

  const sel = $("service");
  if (!sel.options.length) {
    s.services.forEach((name) => sel.append(new Option(name, name)));
    sel.append(new Option("other...", "__other"));
  }

  const due = $("due");
  due.replaceChildren();
  $("dueEmpty").hidden = !!s.due;
  (s.due || []).forEach((r) => {
    const li = el("li");
    li.append(el("span", `pill ${r.state}`, LABELS[r.state]), el("span", "name", r.service), el("span", "detail", detail(r)));
    due.append(li);
  });

  const hist = $("history");
  hist.replaceChildren();
  $("histEmpty").hidden = s.history.length > 0;
  s.history.forEach((e) => {
    const tr = el("tr");
    const what = el("td");
    what.append(el("div", "", e.service));
    if (e.notes) what.append(el("div", "sub", e.notes));
    tr.append(el("td", "date", e.date), el("td", "km", `${fmt(e.km)} km`), what);
    hist.append(tr);
  });

  const st = $("aiStatus");
  st.replaceChildren();
  const dot = el("span", "ai-dot");
  if (!s.ai.online) { st.append(dot, "local AI is offline. Start Ollama to ask questions."); }
  else if (!s.ai.model_ready) { dot.classList.add("warn"); st.append(dot, `Ollama is on, but the model ${s.ai.model} isn't downloaded yet.`); }
  else { dot.classList.add("on"); st.append(dot, `local AI ready · ${s.ai.model} · free, runs on your PC`); }
}

$("check").onclick = () => { store.set("km", $("km").value.trim()); refresh(); };
$("km").addEventListener("keydown", (e) => { if (e.key === "Enter") $("check").click(); });
$("service").onchange = () => { $("otherWrap").hidden = $("service").value !== "__other"; };

$("save").onclick = async () => {
  const service = $("service").value === "__other" ? $("other").value : $("service").value;
  const res = await fetch("/api/service", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ service, km: $("skm").value, date: $("sdate").value, notes: $("notes").value }),
  });
  const data = await res.json();
  $("toast").style.color = res.ok ? "var(--green)" : "var(--red)";
  $("toast").textContent = res.ok ? `saved: ${data.saved.service} at ${fmt(data.saved.km)} km` : data.error;
  if (res.ok) { $("skm").value = ""; $("notes").value = ""; $("other").value = ""; refresh(); }
};

$("ask").onclick = async () => {
  const q = $("q").value.trim();
  if (!q) return;
  const chat = $("chat");
  chat.append(el("div", "msg me", q));
  const thinking = el("div", "msg ai", "thinking...");
  chat.append(thinking);
  chat.scrollTop = chat.scrollHeight;
  $("q").value = ""; $("ask").disabled = true;
  try {
    const res = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, km: $("km").value }),
    });
    const data = await res.json();
    thinking.textContent = res.ok ? data.answer : data.error;
    if (!res.ok) thinking.className = "msg err";
  } catch {
    thinking.textContent = "Couldn't reach the dashboard server."; thinking.className = "msg err";
  }
  $("ask").disabled = false;
  chat.scrollTop = chat.scrollHeight;
};
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").click(); } });

$("sdate").value = new Date().toISOString().slice(0, 10);
const savedKm = store.get("km");
if (savedKm) $("km").value = savedKm;
refresh();
</script>
</body>
</html>
